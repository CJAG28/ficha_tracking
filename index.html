<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Aplicación Segura</title>
  <!-- Script oficial de Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <h1>Bienvenido a la App</h1>

  <!-- Contenedor del botón de Google -->
  <div id="g_id_onload"
       data-client_id="TU_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <!-- Panel del usuario (oculto por defecto) -->
  <div id="panel_usuario" style="display: none; margin-top: 20px;">
    <h3 id="bienvenida_txt"></h3>
    
    <div>
      <h4>Añadir un dato a tu libro:</h4>
      <input type="text" id="campo_dato1" placeholder="Ej. Ventas">
      <input type="text" id="campo_dato2" placeholder="Ej. $150">
      <button onclick="guardarRegistro()">Guardar en mi Libro</button>
    </div>

    <br>
    <button onclick="cargarMisDatos()">Cargar/Consultar mis Datos</button>

    <h4>Tus Datos Registrados:</h4>
    <pre id="resultado_datos"></pre>
  </div>

  <script>
    // Configuración: Coloca la URL de tu Google Apps Script publicada
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";
    
    let userToken = null;

    // Se ejecuta automáticamente cuando el usuario inicia sesión con Google
    function handleCredentialResponse(response) {
      userToken = response.credential; // ID Token seguro firmado por Google
      
      document.querySelector('.g_id_signin').style.display = 'none';
      document.getElementById('panel_usuario').style.display = 'block';
      document.getElementById('bienvenida_txt').innerText = '¡Sesión Iniciada con Éxito!';
      
      // Opcional: Cargar automáticamente los datos del usuario al entrar
      cargarMisDatos();
    }

    // Consultar datos almacenados para este usuario
    async function cargarMisDatos() {
      document.getElementById('resultado_datos').innerText = 'Cargando...';

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            idToken: userToken,
            accion: 'obtenerDatos'
          })
        });

        const data = await res.json();
        if (data.exito) {
          document.getElementById('bienvenida_txt').innerText = 'Hola, ' + data.correo;
          document.getElementById('resultado_datos').innerText = JSON.stringify(data.datos, null, 2);
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        console.error(err);
        document.getElementById('resultado_datos').innerText = 'Error al consultar el servidor.';
      }
    }

    // Guardar un nuevo registro en el libro del usuario
    async function guardarRegistro() {
      const d1 = document.getElementById('campo_dato1').value;
      const d2 = document.getElementById('campo_dato2').value;

      if (!d1 || !d2) {
        alert('Por favor completa ambos campos');
        return;
      }

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            idToken: userToken,
            accion: 'guardarDatos',
            datos: [d1, d2]
          })
        });

        const data = await res.json();
        if (data.exito) {
          alert('¡Guardado con éxito!');
          document.getElementById('campo_dato1').value = '';
          document.getElementById('campo_dato2').value = '';
          cargarMisDatos(); // Recargar la tabla
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        console.error(err);
        alert('Error de conexión con el backend.');
      }
    }
  </script>
</body>
</html>
